<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>포롱이 서바이벌: 연못 수호 디펜스 검증 프로토</title>
<style>
:root{--bg:#06101a;--pn:#0f1c2c;--bd:rgba(255,255,255,.16);--tx:#f1f5f9;--sub:#94a3b8;--pri:#4ade80;--aq:#38bdf8;--gold:#facc15;--red:#fb7185}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Roboto,sans-serif}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none}
#stage{position:absolute;overflow:hidden;background:var(--bg);color:var(--tx)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:1.2em 1.6em;background:rgba(5,12,22,.94);z-index:20;overflow-y:auto}
.scr.on{display:flex}
.scr.clear{background:rgba(5,12,22,.55)}
h1{font-size:2.6em;font-weight:900;text-align:center;line-height:1.15}
h2{font-size:1.5em;font-weight:900}
.sub{color:var(--sub);font-size:1.2em;line-height:1.5}
.btn{display:block;width:100%;border:1px solid var(--bd);background:#16314a;color:var(--tx);font-size:1.5em;font-weight:800;padding:.7em;border-radius:.7em;margin-top:.6em;text-align:center}
.btn.pri{background:linear-gradient(#22c55e,#15803d);border-color:#86efac}
.btn.sm{font-size:1.15em;padding:.5em}
.btn[disabled]{opacity:.4}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:.6em}
.row>*{flex:1}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:.8em;padding:.7em .9em;margin-top:.6em}
.box h3{font-size:1.15em;color:var(--sub);font-weight:700;margin-bottom:.35em}
.card{display:block;width:100%;text-align:left;background:#12273d;border:1px solid var(--bd);border-left:.5em solid var(--c,#38bdf8);border-radius:.6em;padding:.5em .7em;margin-top:.45em;color:var(--tx)}
.card b{font-size:1.4em}
.card span{display:block;color:#b6c4d6;font-size:1.1em;margin-top:.15em}
.card.dim{opacity:.35}
.card.sel{outline:2px solid var(--gold)}
.card[disabled]{opacity:.45}
.chip{flex:1 1 30%;min-width:30%;background:#12273d;border:1px solid var(--bd);border-radius:.6em;padding:.4em .3em;color:var(--tx);text-align:center;font-size:1.05em}
.chip b{display:block;font-size:1.1em}
.chip[disabled]{opacity:.4}
.wrap{display:flex;flex-wrap:wrap;gap:.4em}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.pad{height:2.6em;border-radius:.6em;border:1px dashed var(--bd);background:#0b1a29;color:var(--tx);font-size:1.15em;font-weight:800}
.pad.act{border-style:solid;border-color:#4ade80}
.pad.off{opacity:.3}
.pad.pk{outline:2px solid var(--gold)}
#pauseBtn{position:absolute;top:.3em;right:.3em;width:2.4em;height:2.2em;z-index:15;border-radius:.5em;border:1px solid var(--bd);background:rgba(10,20,34,.7);color:#fff;font-size:1.2em;font-weight:900;display:none}
#pauseBtn.on{display:block}
.srv{display:flex;align-items:center;gap:.3em;margin-top:.45em}
.srv .q{flex:1.5;font-size:1.1em}
.srv button{flex:0 0 2em;height:2em;border-radius:.4em;border:1px solid var(--bd);background:#12273d;color:#fff;font-weight:800;font-size:1.1em}
.srv button.on{background:var(--gold);color:#000}
#copyBox{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.85);display:none;flex-direction:column;padding:1.2em}
#copyBox.on{display:flex}
#copyBox textarea{flex:1;font-size:1em;font-family:monospace;background:#0b1522;color:#e2e8f0;border:1px solid var(--bd);border-radius:.5em;padding:.5em;user-select:text;-webkit-user-select:text}
.tag{display:inline-block;background:#7c3aed;color:#fff;border-radius:99px;padding:.05em .6em;font-size:1em;font-weight:800;margin-right:.3em}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="pauseBtn">II</button>

  <div class="scr on" id="sTitle" style="justify-content:space-between">
    <div style="margin-top:2.2em">
      <div class="sub" style="text-align:center;letter-spacing:.3em;color:#38bdf8;font-weight:800">BAMJIGI STUDIO · 검증 프로토 v0.1</div>
      <h1 style="margin-top:.3em;text-shadow:0 0 .6em #38bdf8">포롱이<br>연못 수호</h1>
      <p class="sub" style="text-align:center;margin-top:1em">벌레 군단을 짧은 웨이브로 막아내고<br>웨이브마다 연못을 키우는 로그라이크 디펜스</p>
    </div>
    <div class="box">
      <h3>조작</h3>
      <p class="sub" style="color:#e2e8f0">탭: 그 자리로 혀 타격 (꾹 누르면 느린 자동 반복)<br>왼쪽 아래 드래그: 포롱이 이동<br>3번째 명중은 강타! · 맞으면 3초 기절 · 연못이 0이 되면 패배</p>
    </div>
    <div>
      <button class="btn pri" id="bStart">게임 시작</button>
      <div class="row">
        <button class="btn sm" id="bSound">소리 ON</button>
        <button class="btn sm" id="bVib">진동 ON</button>
      </div>
      <button class="btn sm" id="bCopyAll">플레이 로그 복사 (저장 0판)</button>
      <button class="btn sm" id="bClear">저장된 로그 지우기</button>
    </div>
  </div>

  <div class="scr" id="sInter"></div>
  <div class="scr" id="sBranch"></div>
  <div class="scr" id="sPause" style="justify-content:center">
    <h2 style="text-align:center">일시정지</h2>
    <button class="btn pri" id="bResume">계속하기</button>
    <button class="btn sm" id="bCopyNow">지금까지 로그 복사</button>
    <button class="btn sm" id="bQuit">포기하고 결과 보기</button>
  </div>
  <div class="scr" id="sResult"></div>
  <div id="copyBox">
    <p class="sub" style="margin-bottom:.5em">아래 글을 전체 선택해서 복사해 전달해 주세요.</p>
    <textarea id="copyTa" readonly></textarea>
    <button class="btn" id="bCopyClose">닫기</button>
  </div>
</div>

<script>
'use strict';
const VER='pond-defense-proto v0.1';
const W=360,H=640,POND_Y=505,LANES=[70,180,290];
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const URLP=new URLSearchParams(location.search);

/* ================= 데이터 ================= */
const ET={
  grunt:{n:'졸개',hp:22,sp:42,r:12,dmg:4,col:'#a3e635',dew:1},
  rusher:{n:'돌진',hp:15,sp:92,r:10,dmg:6,col:'#fb923c',dew:1},
  armor:{n:'갑옷',hp:72,sp:30,r:15,dmg:8,col:'#94a3b8',dew:2,armor:.5},
  ranged:{n:'원거리',hp:30,sp:36,r:12,dmg:5,col:'#c084fc',dew:2},
  elite:{n:'엘리트',hp:420,sp:30,r:22,dmg:16,col:'#f43f5e',dew:12,armor:.25},
  boss:{n:'장수풍뎅이 대왕',hp:2000,sp:14,r:34,dmg:30,col:'#7f1d1d',dew:0,armor:.3},
  mini:{n:'새끼',hp:10,sp:55,r:8,dmg:2,col:'#d9f99d',dew:0}
};
const MUT={
  wing:{n:'날개 군단',d:'날아서 와요! 늪·전열이 안 통해요. 원거리·번개로 대응'},
  armored:{n:'단단한 갑옷',d:'약한 타격은 반감! 3타 강타·독·불꽃으로 대응'},
  split:{n:'분열',d:'죽으면 작은 둘로 쪼개져요. 범위·연쇄로 대응'},
  regen:{n:'재생',d:'맞지 않으면 체력이 차올라요. 불꽃·독으로 대응'},
  frenzy:{n:'광폭',d:'빠르고, 다칠수록 더 빨라져요. 얼음·늪·전열로 대응'},
  swarm:{n:'물량 폭주',d:'수는 1.6배, 체력은 낮아요. 범위·연쇄·설치로 대응'}
};
const WAVES=[
  {mix:{grunt:14},mut:[]},
  {mix:{grunt:12,rusher:6},mut:['wing']},
  {mix:{grunt:10,armor:5,ranged:3},mut:['armored']},
  {mix:{grunt:12,rusher:6,ranged:4},mut:['split']},
  {mix:{grunt:10,armor:6,rusher:4},mut:['regen']},
  {mix:{grunt:12,ranged:6,rusher:6},mut:['frenzy']},
  {mix:{grunt:12,armor:5,ranged:4,rusher:5},mut:['swarm','wing']},
  {boss:true,mix:{},mut:[]}
];
const BRANCH_AFTER=[2,5];
const ROLES={
  front:{n:'두꺼비 뚝이',role:'전열',col:'#f59e0b',ch:'전',skill:'방패 밀치기',cd:8,desc:'주변 적을 늦추며 아프게 하고, 스킬로 밀쳐 기절시켜요'},
  range:{n:'물총새 쪼롱',role:'원거리',col:'#38bdf8',ch:'원',skill:'물총 난사',cd:9,desc:'가장 연못에 가까운 적을 쏘고, 스킬로 난사해요'},
  support:{n:'반딧불 반디',role:'지원',col:'#fde047',ch:'지',skill:'반짝 치유',cd:12,desc:'연못을 서서히 회복, 혀 피해 +12%, 스킬로 크게 치유'},
  trap:{n:'달팽이 늘보',role:'설치',col:'#c084fc',ch:'설',skill:'대형 늪',cd:11,desc:'늪을 깔아 적을 늦추고 아프게 해요'}
};
const PADS=[{x:70,y:540},{x:180,y:540},{x:290,y:540},{x:70,y:602},{x:180,y:602},{x:290,y:602}];
const PAD_ORDER=[0,2,3,5,1,4];
const ELEMS={fire:{n:'불꽃',col:'#fb923c'},water:{n:'물',col:'#38bdf8'},volt:{n:'번개',col:'#facc15'},poison:{n:'독',col:'#a855f7'},ice:{n:'얼음',col:'#bae6fd'}};
const RELICS=[
  {id:'crown',n:'개구리 왕관',d:'강타가 2번째 명중마다 터져요',ap:()=>{S.strongEvery=2}},
  {id:'dewpearl',n:'이슬 구슬',d:'이슬 획득 +40%',ap:()=>{S.dewMul*=1.4}},
  {id:'seedbag',n:'연꽃 씨앗 주머니',d:'매 웨이브 시작 시 연못 +8',ap:()=>{S.waveHeal+=8}},
  {id:'bigtongue',n:'거대한 혀',d:'타격 반경 +35% (쿨다운 15% 느려짐)',ap:()=>{S.radMul*=1.35;S.cdMul*=1.15}},
  {id:'echo',n:'메아리 혀',d:'4번 타격마다 무료 추가 타격이 적에게 날아가요',ap:()=>{S.echo=true}},
  {id:'anthem',n:'동료 응원가',d:'동료 스킬 쿨다운 25% 감소',ap:()=>{S.skillCd*=.75}},
  {id:'charm',n:'수호 부적',d:'연못이 받는 피해 -20%',ap:()=>{S.pondDmgMul*=.8}}
];
const FAC=[
  {id:'lotus',n:'연꽃 방벽',d:'방벽 +20 (연못 앞에서 피해 흡수)',max:9,cost:l=>25+8*l,ap:()=>{S.pond.shield+=20}},
  {id:'wheel',n:'물레방아',d:'아래쪽 적 이동 -8%',max:3,cost:l=>[40,55,70][l],ap:()=>{}},
  {id:'lantern',n:'등불',d:'혀 반경 +8%·동료 피해 +12%',max:3,cost:l=>[40,55,70][l],ap:()=>{}},
  {id:'fountain',n:'분수',d:'전투 중 연못 초당 +0.8 회복',max:3,cost:l=>[45,60,75][l],ap:()=>{}},
  {id:'widen',n:'연못 넓히기',d:'연못 최대 +20, 즉시 +20 회복',max:3,cost:l=>[35,45,55][l],ap:()=>{S.pond.max+=20;S.pond.hp+=20}}
];

/* ================= 상태 ================= */
let S=null,scene='title',P={},enemies=[],projs=[],bullets=[],swamps=[],parts=[],floats=[],rings=[],bolts=[];
let opt={sound:true,vib:true};
try{const o=JSON.parse(localStorage.getItem('pdOpt')||'{}');Object.assign(opt,o)}catch(e){}
let shake=0,hitstop=0,slowT=0,flashPond=0,banner=null,paused=false,gTime=0;
const input={joy:null,atk:null};
let runs=[];try{runs=JSON.parse(localStorage.getItem('pdRuns')||'[]')}catch(e){}
function saveRuns(){try{localStorage.setItem('pdRuns',JSON.stringify(runs.slice(-20)))}catch(e){}}
function saveOpt(){try{localStorage.setItem('pdOpt',JSON.stringify(opt))}catch(e){}}

/* ================= 오디오/진동 ================= */
let AC=null;
function beep(f,d=.08,type='square',v=.05,slide=0){
  if(!opt.sound)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
    g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
function vib(ms){if(opt.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

/* ================= 런 생성 ================= */
function newRun(startWave){
  S={
    wi:startWave,t:0,wtotal:0,gt:0,
    pond:{hp:100,max:100,shield:0},dew:20,
    // 혀
    dmgLvl:0,radMul:1,rangeMul:1,cdMul:1,pierce:false,chain:0,elem:{},strongEvery:3,echo:false,echoN:0,
    dewMul:1,waveHeal:0,pondDmgMul:1,skillCd:1,
    comps:[],padN:4,fac:{},relics:[],
    combo:0,comboT:0,cd:0,
    queue:[],muts:[],eliteNext:false,eliteKilled:false,waveClear:false,clearT:0,
    pendingBranch:false,pendingRelic:false,
    bossPhase:0,boss:null,
    ws:null,logWaves:[],choices:[],
    st:{taps:0,hits:0,miss:0,strong:0,maxCombo:0,stuns:0,leaks:0,kills:0,pondLost:0,dewTotal:0,echo:0,hold:0,skills:{}},
    dmgBy:{tongue:0,comp:0,dot:0,skill:0},
    first30:null,ev:[],result:null,survey:{},started:Date.now(),over:false
  };
  S.padComp=[null,null,null,null,null,null];
  addComp('front');addComp('range');
  enemies=[];projs=[];bullets=[];swamps=[];parts=[];floats=[];rings=[];bolts=[];
  P={x:W/2,y:430,stun:0,inv:0,face:1,wob:0};
  if(URLP.get('dew'))S.dew=+URLP.get('dew');
  if(URLP.get('slots'))S.padN=+URLP.get('slots');
  if(URLP.get('comps')){URLP.get('comps').split(',').forEach(r=>{if(ROLES[r]&&!S.comps.find(c=>c.role===r))addComp(r)})}
  ev('런 시작 (시작 웨이브 '+(startWave+1)+')');
}
function ev(s){if(S)S.ev.push('['+S.gt.toFixed(1)+'s] '+s)}
function activePads(){return PAD_ORDER.slice(0,S.padN)}
function addComp(role){
  const c={role,lvl:1,cd:ROLES[role].cd*.5,at:1,pop:0,pad:-1};
  const free=activePads().find(i=>S.padComp[i]==null);
  if(free==null)return false;
  c.pad=free;S.padComp[free]=c;S.comps.push(c);return true;
}
const cm=c=>1+.4*(c.lvl-1);
const facL=id=>S.fac[id]||0;
const hitR=()=>22*S.radMul*(1+.08*facL('lantern'));
const tRange=()=>150*S.rangeMul;
const tCd=()=>.35*S.cdMul;
const tDmg=()=>14*(1+.25*S.dmgLvl)*(S.comps.some(c=>c.role==='support')?1.12:1);
const compDmgMul=()=>1+.12*facL('lantern');

/* ================= 웨이브 ================= */
function startWave(i){
  S.wi=i;S.t=0;S.waveClear=false;S.clearT=0;S.eliteKilled=false;
  const w=WAVES[i];S.muts=w.mut.slice();
  S.queue=[];enemies=[];projs=[];bullets=[];swamps=[];
  const swarm=S.muts.includes('swarm');
  if(w.boss){
    S.queue.push({t:.8,type:'boss',x:W/2});
  }else{
    const list=[];
    for(const [k,n] of Object.entries(w.mix)){const c=Math.round(n*(swarm?1.6:1));for(let j=0;j<c;j++)list.push(k)}
    for(let j=list.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[list[j],list[k]]=[list[k],list[j]]}
    const n=list.length,dur=26;
    list.forEach((type,j)=>S.queue.push({t:1+(j/n)*dur+rnd(-.4,.4),type,x:pick(LANES)+rnd(-28,28)}));
    if(S.eliteNext){S.queue.push({t:9,type:'elite',x:pick(LANES)});S.eliteNext=false;S.eliteWave=true}else S.eliteWave=false;
    S.queue.sort((a,b)=>a.t-b.t);
  }
  S.ws={w:i+1,start:S.gt,leaks:0,pondLost:0,kills:0,taps:0,hits:0,hp0:S.pond.hp};
  S.pond.hp=Math.min(S.pond.max,S.pond.hp+S.waveHeal);
  P.x=W/2;P.y=430;P.stun=0;P.inv=0;
  banner={t:2.2,l1:w.boss?'BOSS':'WAVE '+(i+1)+' / 7',l2:S.muts.length?S.muts.map(m=>MUT[m].n).join(' + '):(w.boss?'장수풍뎅이 대왕 출현!':'변이 없음')};
  ev('웨이브 '+(i+1)+' 시작 (연못 '+Math.round(S.pond.hp)+'/'+S.pond.max+', 이슬 '+Math.floor(S.dew)+', 변이: '+(S.muts.map(m=>MUT[m].n).join('+')||'없음')+(S.eliteWave?', 엘리트 포함':'')+')');
  scene='battle';
  hideAll();$('pauseBtn').classList.add('on');
  beep(330,.15,'triangle',.06,220);
}
function mkEnemy(type,x,y,o={}){
  const d=ET[type],M=S.muts;
  const sc=1+.07*S.wi;
  let hp=d.hp*(type==='boss'||type==='mini'?1:sc),sp=d.sp,armor=d.armor||0;
  if(type==='boss')hp=d.hp*(1+.03*S.comps.length);
  if(M.includes('swarm')&&type!=='boss'&&type!=='elite')hp*=.6;
  const e={type,x,y,r:d.r,hp,max:hp,sp,dmg:d.dmg,col:d.col,armor,fly:false,
    stun:0,freeze:0,slow:0,slowAmt:1,wet:0,burn:0,poison:0,pStack:0,chill:0,
    kx:0,ky:0,sq:0,flash:0,hitT:9,age:0,dead:false,t:Math.random()*9,shootT:rnd(1,2.5),stopY:rnd(110,190),aux:0};
  if(o.mini){e.r=8;}
  if(type!=='boss'&&type!=='elite'){
    if(M.includes('wing')&&type!=='mini'){e.fly=true;e.sp*=1.3;e.hp*=.8;e.max=e.hp}
    if(M.includes('armored')&&type!=='mini'){e.armor=Math.max(e.armor,.4);e.hp*=1.25;e.max=e.hp}
  }
  if(M.includes('frenzy')&&type!=='boss'){e.sp*=1.25}
  if(o.hpMul){e.hp*=o.hpMul;e.max=e.hp}
  if(type==='boss'){e.mode='march';e.ph=1;e.sumT=3;e.bombT=2.5;e.chT=6;e.charge=null;e.sp=14}
  if(type==='elite'){e.chT=5;e.sumT=8;e.charge=null}
  enemies.push(e);return e;
}
function spawnFX(e){for(let i=0;i<4;i++)parts.push({x:e.x,y:e.y,vx:rnd(-40,40),vy:rnd(-10,40),t:0,life:.4,col:e.col,r:3})}

/* ================= 피해/처치 ================= */
function floatText(x,y,txt,col='#fff',sz=13){floats.push({x,y,txt,col,sz,t:0})}
function dmgE(e,amt,src,o={}){
  if(e.dead||amt<=0)return;
  if(e.armor&&!o.strong&&!o.ign)amt*=(1-e.armor);
  e.hp-=amt;e.hitT=0;S.dmgBy[src]=(S.dmgBy[src]||0)+amt;
  if(!o.quiet)floatText(e.x+rnd(-6,6),e.y-e.r-4,Math.round(amt),o.strong?'#fde047':'#fff',o.strong?18:13);
  if(e.hp<=0)kill(e);
}
function kill(e){
  if(e.dead)return;e.dead=true;S.st.kills++;S.ws.kills++;
  const d=ET[e.type];
  const g=Math.round((d.dew||0)*S.dewMul);if(g>0){S.dew+=g;S.st.dewTotal+=g}
  for(let i=0;i<8;i++){const a=rnd(0,6.28);parts.push({x:e.x,y:e.y,vx:Math.cos(a)*rnd(30,110),vy:Math.sin(a)*rnd(30,110),t:0,life:.45,col:e.col,r:rnd(2,4)})}
  if(S.muts.includes('split')&&e.type!=='mini'&&e.type!=='boss'&&e.type!=='elite'){
    for(let k=0;k<2;k++){const m=mkEnemy('mini',e.x+(k?10:-10),e.y,{mini:true,hpMul:1});m.fly=e.fly;m.kx=k?80:-80}
  }
  if(e.type==='elite'){S.eliteKilled=true;S.dew+=Math.round(20*S.dewMul);ev('엘리트 처치');beep(200,.3,'sawtooth',.07,-80)}
  if(e.type==='boss'){ev('보스 처치!');bossDead()}
}
function pondHit(n,src){
  n*=S.pondDmgMul;
  if(S.pond.shield>0){const a=Math.min(S.pond.shield,n);S.pond.shield-=a;n-=a}
  if(n>0){S.pond.hp-=n;S.st.pondLost+=n;S.ws.pondLost+=n}
  flashPond=.25;shake=Math.max(shake,3);beep(120,.15,'sawtooth',.06,-50);vib(25);
  if(S.pond.hp<=0&&!S.over){S.pond.hp=0;ev('연못 붕괴! ('+src+')');endRun('lose')}
}

/* ================= 혀 공격 ================= */
function strike(tx,ty,weak){
  if(P.stun>0||S.cd>0||scene!=='battle'||S.over)return false;
  const mx=P.x,my=P.y-8;
  let dx=tx-mx,dy=ty-my,d=Math.hypot(dx,dy)||1;
  const R=tRange();
  if(d>R){tx=mx+dx/d*R;ty=my+dy/d*R}
  S.cd=tCd();S.st.taps++;S.ws.taps++;
  const strong=!weak&&S.combo%S.strongEvery===S.strongEvery-1;
  const rad=hitR()*(strong?1.3:1);
  const hits=enemies.filter(e=>!e.dead&&dist(e.x,e.y,tx,ty)<=rad+e.r);
  let pierced=[];
  if(S.pierce){
    const sx=tx-mx,sy=ty-my,L2=sx*sx+sy*sy||1;
    pierced=enemies.filter(e=>!e.dead&&!hits.includes(e)&&(()=>{
      const t=clamp(((e.x-mx)*sx+(e.y-my)*sy)/L2,0,1);
      return dist(e.x,e.y,mx+sx*t,my+sy*t)<=12+e.r})());
  }
  let pr=0;
  for(let i=projs.length-1;i>=0;i--){if(dist(projs[i].x,projs[i].y,tx,ty)<=rad+7){parts.push({x:projs[i].x,y:projs[i].y,vx:0,vy:0,t:0,life:.25,col:'#e9d5ff',r:6});projs.splice(i,1);pr++}}
  P.tongue={tx,ty,t:0,strong};
  P.face=tx>=P.x?1:-1;
  rings.push({x:tx,y:ty,r0:rad*.4,r1:rad,t:0,life:.18,col:hits.length||pr?(strong?'#fde047':'#fda4af'):'rgba(255,255,255,.25)'});
  if(!hits.length&&!pierced.length&&!pr){
    S.st.miss++;beep(180,.05,'sine',.03);return true;
  }
  S.st.hits++;S.ws.hits++;if(weak)S.st.hold++;
  const base=tDmg()*(weak?.7:1)*(strong?2:1);
  hits.sort((a,b)=>dist(a.x,a.y,tx,ty)-dist(b.x,b.y,tx,ty));
  hits.forEach((e,i)=>{
    dmgE(e,base,'tongue',{strong});
    let ax=e.x-tx,ay=e.y-ty,al=Math.hypot(ax,ay)||1;
    const kb=strong?(e.type==='boss'?18:e.type==='elite'?60:130):(e.type==='boss'?0:35);
    if(!(e.charge))e.kx+=ax/al*kb*.5;
    if(!(e.charge))e.ky-=Math.abs(kb)*(strong?1:.8)+0;
    e.sq=.2;e.flash=.08;
    if(!e.dead)onHit(e,base,strong,i===0&&!weak||i===0);
  });
  pierced.forEach(e=>{dmgE(e,base*.5,'tongue',{strong:false});e.flash=.06;if(!e.dead)applyElems(e)});
  S.combo++;S.comboT=1.7;S.st.maxCombo=Math.max(S.st.maxCombo,S.combo);
  if(strong){S.st.strong++;hitstop=.08;slowT=.12;shake=Math.max(shake,7);beep(110,.18,'sawtooth',.08,-40);vib(30);
    rings.push({x:tx,y:ty,r0:rad*.5,r1:rad*1.9,t:0,life:.3,col:'#fde047'})}
  else{hitstop=.05;shake=Math.max(shake,2);}
  const step=Math.min(S.combo,10);beep(300+step*45,.07,'square',.05);
  for(let i=0;i<5;i++){const a=rnd(0,6.28);parts.push({x:tx,y:ty,vx:Math.cos(a)*80,vy:Math.sin(a)*80,t:0,life:.25,col:strong?'#fde047':'#fff',r:2.5})}
  if(S.echo&&!weak){S.echoN++;if(S.echoN%4===0&&enemies.length){const t=pick(enemies);S.st.echo++;
    dmgE(t,tDmg()*.6,'tongue',{});bolts.push({x1:P.x,y1:P.y-8,x2:t.x,y2:t.y,t:0,life:.2,col:'#4ade80'});t.flash=.06}}
  return true;
}
function onHit(e,base,strong,primary){
  applyElems(e);
  // 연쇄
  const n=S.chain+(S.elem.volt?2:0)+(S.elem.volt&&e.wet>0?1:0);
  if(n>0&&primary){
    const m=(S.elem.volt&&e.wet>0)?.7:.45;
    const near=enemies.filter(o=>o!==e&&!o.dead&&dist(o.x,o.y,e.x,e.y)<110).sort((a,b)=>dist(a.x,a.y,e.x,e.y)-dist(b.x,b.y,e.x,e.y)).slice(0,n);
    let prev=e;
    near.forEach(o=>{dmgE(o,base*m,'tongue',{strong:false,quiet:false});o.flash=.06;bolts.push({x1:prev.x,y1:prev.y,x2:o.x,y2:o.y,t:0,life:.22,col:S.elem.volt?'#facc15':'#86efac'});prev=o});
  }
}
function applyElems(e){
  const E=S.elem;
  if(E.fire)e.burn=4;
  if(E.water)e.wet=5;
  if(E.poison){e.poison=5;e.pStack=Math.min(5,e.pStack+1)}
  if(E.ice&&e.type!=='boss'){e.slow=2;e.slowAmt=.5;e.chill++;if(e.chill>=3){e.chill=0;e.freeze=1.1}}
  else if(E.ice){e.slow=2;e.slowAmt=.6}
  if(E.water&&!E.ice){e.slow=Math.max(e.slow,1.5);e.slowAmt=Math.min(e.slowAmt,.85)}
}

/* ================= 동료 ================= */
function padPos(c){return PADS[c.pad]}
function castFX(c,label){
  const p=padPos(c);c.pop=.5;
  rings.push({x:p.x,y:p.y,r0:10,r1:70,t:0,life:.45,col:ROLES[c.role].col});
  floatText(p.x,p.y-34,label,ROLES[c.role].col,13);
  S.st.skills[c.role]=(S.st.skills[c.role]||0)+1;
  beep(520,.12,'triangle',.05,300);
}
function skill(c){
  const p=padPos(c),m=cm(c)*compDmgMul();
  castFX(c,ROLES[c.role].skill);
  if(c.role==='front'){
    enemies.forEach(e=>{if(e.dead||dist(e.x,e.y,p.x,p.y)>125)return;
      dmgE(e,22*m,'skill',{quiet:true,ign:false});
      if(!e.dead&&e.type!=='boss'){e.ky-=170;e.stun=Math.max(e.stun,.9+.2*c.lvl)}else if(e.type==='boss'&&!e.charge)e.ky-=10;
    });
    rings.push({x:p.x,y:p.y,r0:20,r1:125,t:0,life:.35,col:'#fbbf24'});
    shake=Math.max(shake,4);
  }else if(c.role==='range'){
    const n=7+2*c.lvl;
    for(let i=0;i<n;i++){
      const t=enemies.length?pick(enemies):null;
      bullets.push({x:p.x+rnd(-8,8),y:p.y-10,v:rnd(260,340),dmg:12*m,tgt:t,vx:rnd(-80,80),vy:-rnd(60,160),src:'skill',life:2,delay:i*.05});
    }
  }else if(c.role==='support'){
    S.pond.hp=Math.min(S.pond.max,S.pond.hp+14*m);
    P.stun=0;P.inv=Math.max(P.inv,1.5);
    for(let i=0;i<10;i++)parts.push({x:rnd(40,320),y:rnd(520,600),vx:0,vy:-rnd(20,50),t:0,life:.8,col:'#86efac',r:3});
    floatText(W/2,POND_Y+10,'+'+Math.round(14*m),'#86efac',16);
  }else if(c.role==='trap'){
    let x=rnd(80,280),y=rnd(260,420);
    if(enemies.length){const t=pick(enemies.filter(e=>e.y>200)||enemies)||pick(enemies);if(t){x=t.x;y=clamp(t.y+30,230,470)}}
    swamps.push({x,y,r:85,t:9+c.lvl,dps:7*m,big:true});
  }
}
function updComps(dt){
  const lowPond=S.pond.hp<S.pond.max-6;
  S.comps.forEach(c=>{
    const p=padPos(c),m=cm(c)*compDmgMul();
    c.pop=Math.max(0,c.pop-dt);
    c.cd=Math.max(0,c.cd-dt/S.skillCd*1);
    const hasT=enemies.some(e=>!e.dead);
    const ready=c.cd<=0&&(c.role==='support'?lowPond:hasT);
    if(ready){skill(c);c.cd=ROLES[c.role].cd}
    c.at-=dt;
    if(c.role==='front'){
      const R=80+6*c.lvl;
      enemies.forEach(e=>{if(e.dead||e.fly)return;
        if(dist(e.x,e.y,p.x,p.y)<R+e.r){e.inFront=true;dmgE(e,11*m*dt,'comp',{quiet:true})}});
    }else if(c.role==='range'){
      if(c.at<=0&&hasT){
        let t=null,by=-1;enemies.forEach(e=>{if(!e.dead&&e.y>by&&dist(e.x,e.y,p.x,p.y)<340){by=e.y;t=e}});
        if(t){bullets.push({x:p.x,y:p.y-12,v:380,dmg:9*m,tgt:t,vx:0,vy:0,src:'comp',life:2,delay:0});c.at=.85/(1+.18*(c.lvl-1))}
        else c.at=.2;
      }
    }else if(c.role==='support'){
      if(c.at<=0){c.at=5;if(lowPond){S.pond.hp=Math.min(S.pond.max,S.pond.hp+2*m);parts.push({x:p.x,y:p.y-14,vx:0,vy:-30,t:0,life:.6,col:'#86efac',r:3})}}
    }else if(c.role==='trap'){
      if(c.at<=0&&hasT&&swamps.filter(s=>!s.big).length<4){c.at=4.5;swamps.push({x:pick(LANES)+rnd(-30,30),y:rnd(250,440),r:42,t:7,dps:4*m,big:false})}
    }
  });
}
function updBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.delay>0){b.delay-=dt;continue}
    b.life-=dt;
    if(!b.tgt||b.tgt.dead){b.tgt=enemies.filter(e=>!e.dead).sort((a,c)=>dist(a.x,a.y,b.x,b.y)-dist(c.x,c.y,b.x,b.y))[0]||null}
    if(b.vx||b.vy){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=.9;b.vy*=.9;if(Math.abs(b.vx)+Math.abs(b.vy)<20){b.vx=0;b.vy=0}}
    else if(b.tgt){
      const dx=b.tgt.x-b.x,dy=b.tgt.y-b.y,d=Math.hypot(dx,dy)||1;
      b.x+=dx/d*b.v*dt;b.y+=dy/d*b.v*dt;
      if(d<b.tgt.r+5){dmgE(b.tgt,b.dmg,b.src,{quiet:true,ign:false});b.tgt.flash=.05;parts.push({x:b.x,y:b.y,vx:0,vy:0,t:0,life:.15,col:'#7dd3fc',r:4});b.life=0}
    }
    if(b.life<=0||!b.tgt&&!b.vx&&!b.vy&&b.life<1.5)bullets.splice(i,1);
  }
}

/* ================= 전투 업데이트 ================= */
function bossPhase(e){const r=e.hp/e.max;return r>.66?1:r>.33?2:3}
function updEnemy(e,dt){
  e.age+=dt;e.t+=dt;e.hitT+=dt;e.flash=Math.max(0,e.flash-dt);e.sq=Math.max(0,e.sq-dt);
  if(e.stun>0)e.stun-=dt;if(e.freeze>0)e.freeze-=dt;if(e.slow>0)e.slow-=dt;if(e.wet>0)e.wet-=dt;
  if(e.burn>0){e.burn-=dt;dmgE(e,7*dt,'dot',{quiet:true,ign:true})}
  if(e.poison>0){e.poison-=dt;dmgE(e,2*e.pStack*dt,'dot',{quiet:true,ign:true});if(e.poison<=0)e.pStack=0}
  if(e.dead)return;
  if(S.muts.includes('regen')&&e.hitT>1.5&&e.burn<=0&&e.hp<e.max)e.hp=Math.min(e.max,e.hp+e.max*.05*dt);
  // knockback
  e.x+=e.kx*dt;e.y+=e.ky*dt;const k=Math.pow(.03,dt);e.kx*=k;e.ky*=k;
  let m=1;
  if(e.stun>0||e.freeze>0)m=0;
  else{
    if(e.slow>0)m*=e.slowAmt;
    if(!e.fly){
      if(e.inFront)m*=.4;
      for(const s of swamps){if(dist(e.x,e.y,s.x,s.y)<s.r){m*=s.big?.4:.5;dmgE(e,s.dps*dt,'comp',{quiet:true,ign:true});e.inSwamp=true}}
      if(e.y>260)m*=1-.08*facL('wheel');
    }
    if(S.muts.includes('frenzy')&&e.hp<e.max*.5&&e.type!=='boss')m*=1.3;
    if(S.t>45)m*=1.8;
  }
  e.inFront=false;
  const sp=e.sp*m;
  const T=e.type;
  if(T==='boss')return updBoss(e,dt,m);
  if(T==='ranged'&&!e.rage){
    if(e.y<e.stopY)e.y+=sp*dt;
    else{e.shootT-=dt*(m>0?1:0);if(e.shootT<=0){e.shootT=2.6;
      projs.push({x:e.x,y:e.y+8,tx:rnd(60,300),ty:POND_Y+12,sp:120,dmg:e.dmg});beep(260,.06,'sine',.03)}}
  }else if(T==='elite'){
    if(e.charge){
      e.charge.t-=dt;
      if(e.charge.t>0){/* 예고 */}
      else{e.y+=380*dt*(m>0?1:.2)}
    }else{
      e.y+=sp*dt;e.x+=Math.sin(e.t*1.5)*20*dt*(m>0?1:0);
      e.chT-=dt;e.sumT-=dt;
      if(e.chT<=0&&e.y<350){e.charge={t:.9};e.chT=6.5}
      if(e.sumT<=0){e.sumT=9;for(let i=0;i<2;i++)mkEnemy('grunt',e.x+(i?18:-18),e.y+10)}
    }
    if(e.charge&&e.charge.t<-1.1)e.charge=null;
  }else if(T==='rusher'){
    e.y+=sp*dt;e.x+=Math.sin(e.t*5)*30*dt*(m>0?1:0);
  }else{
    e.y+=sp*dt;e.x+=Math.sin(e.t*2.2+e.aux)*14*dt*(m>0?1:0);
  }
  e.x=clamp(e.x,e.r,W-e.r);
  e.y=Math.max(e.y,40);
  // 포롱이 충돌
  if(P.stun<=0&&P.inv<=0&&e.freeze<=0&&dist(e.x,e.y,P.x,P.y)<e.r+11){
    P.stun=3;S.st.stuns++;ev('기절 (원인: '+ET[T].n+')');
    const ax=P.x-e.x,ay=P.y-e.y,al=Math.hypot(ax,ay)||1;e.kx-=ax/al*180;e.ky-=ay/al*180;
    shake=Math.max(shake,5);beep(90,.25,'sawtooth',.07,-30);vib(60);
    floatText(P.x,P.y-24,'기절!','#fda4af',16);
  }
  // 연못 도달
  if(e.y>=POND_Y-e.r*.6){
    pondHit(e.dmg,ET[T].n);S.st.leaks++;S.ws.leaks++;e.dead=true;
    for(let i=0;i<6;i++)parts.push({x:e.x,y:POND_Y,vx:rnd(-60,60),vy:rnd(-90,-20),t:0,life:.4,col:'#7dd3fc',r:3});
  }
}
function updBoss(e,dt,m){
  const ph=bossPhase(e);
  if(ph!==e.ph){e.ph=ph;S.bossPhase=ph;banner={t:1.8,l1:'BOSS PHASE '+ph,l2:ph===2?'돌진 공격 시작!':'광폭화! 포격 + 소환'};
    ev('보스 페이즈 '+ph);rings.push({x:e.x,y:e.y,r0:20,r1:300,t:0,life:.6,col:'#fb7185'});shake=8;beep(100,.4,'sawtooth',.09,-40)}
  if(e.charge){
    e.charge.t-=dt;
    if(e.charge.t<=0){
      if(!e.charge.go){e.charge.go=true}
      if(e.charge.go&&!e.charge.back){
        e.y+=520*dt;e.x+=(e.charge.x-e.x)*Math.min(1,dt*6);
        if(P.stun<=0&&P.inv<=0&&dist(e.x,e.y,P.x,P.y)<e.r+11){P.stun=3;S.st.stuns++;ev('기절 (원인: 보스 돌진)');shake=8;floatText(P.x,P.y-24,'기절!','#fda4af',16);vib(80)}
        if(e.y>=POND_Y-e.r){pondHit(e.dmg*(ph===3?.8:.6),'보스 돌진');e.charge.back=true;shake=10;rings.push({x:e.x,y:POND_Y,r0:10,r1:120,t:0,life:.4,col:'#fb7185'})}
      }else if(e.charge.back){e.y-=190*dt;if(e.y<=160){e.y=160;e.charge=null}}
    }
    return;
  }
  e.x+=Math.sin(e.t*.9)*30*dt;
  if(e.y<160)e.y+=14*m*dt*3;else e.y=160+ (e.y>160?0:0);
  e.x=clamp(e.x,e.r,W-e.r);
  if(m===0)return;
  e.sumT-=dt;e.bombT-=dt;e.chT-=dt;
  const bombI=ph===3?1.6:ph===2?3:3.4;
  if(e.bombT<=0){e.bombT=bombI;const n=ph===3?2:1;for(let i=0;i<n;i++)projs.push({x:e.x+rnd(-20,20),y:e.y+20,tx:rnd(50,310),ty:POND_Y+12,sp:130,dmg:7});beep(200,.1,'sine',.04)}
  if(e.sumT<=0){
    if(ph===1){e.sumT=6;for(let i=0;i<3;i++)mkEnemy('grunt',e.x+(i-1)*24,e.y+30)}
    else if(ph===2){e.sumT=6;for(let i=0;i<2;i++)mkEnemy('rusher',e.x+(i?20:-20),e.y+30);mkEnemy('armor',e.x,e.y+34)}
    else{e.sumT=5;for(let i=0;i<4;i++)mkEnemy(i%2?'rusher':'grunt',e.x+(i-1.5)*22,e.y+30)}
  }
  if(ph>=2&&e.chT<=0){e.chT=ph===3?6:8;e.charge={t:1.1,x:pick(LANES),lane:true}}
}
function bossDead(){
  enemies.forEach(e=>{if(!e.dead&&e.type!=='boss'){e.dead=true}});
  shake=12;hitstop=.2;slowT=.6;
  setTimeout(()=>endRun('win'),900);S.over=true;
}
function updProjs(dt){
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i],dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;
    p.x+=dx/d*p.sp*dt;p.y+=dy/d*p.sp*dt;
    if(d<8||p.y>=POND_Y){pondHit(p.dmg,'원거리 사격');projs.splice(i,1)}
  }
}
function updPlayer(dt){
  P.stun=Math.max(0,P.stun-dt);
  if(P.stun>0){P.inv=1.0;P.wob+=dt*20;return}
  P.inv=Math.max(0,P.inv-dt);
  const j=input.joy;
  if(j&&j.active){
    const dx=j.cx-j.ox,dy=j.cy-j.oy,d=Math.hypot(dx,dy);
    if(d>6){const f=Math.min(1,d/45),sp=160*f;P.x+=dx/d*sp*dt;P.y+=dy/d*sp*dt;if(Math.abs(dx)>4)P.face=dx>0?1:-1}
  }
  P.x=clamp(P.x,16,W-16);P.y=clamp(P.y,190,485);
}
function update(dt){
  if(scene!=='battle')return;
  S.gt+=dt;S.t+=dt;
  if(!S.first30&&S.gt>=30&&S.wi>=0){S.first30={taps:S.st.taps,hits:S.st.hits};}
  S.cd=Math.max(0,S.cd-dt);
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0}
  // 입력: 꾹 누르기
  const a=input.atk;
  if(a&&a.down){
    a.held+=dt;
    if(a.held>.28&&S.cd<=0&&gTime-a.last>=.6){a.last=gTime;strike(a.x,a.y,true)}
  }
  if(a&&a.buf>0){a.buf-=dt;if(S.cd<=0){const ok=strike(a.bx,a.by,false);a.buf=0;if(ok)a.last=gTime}}
  updPlayer(dt);
  // 스폰
  while(S.queue.length&&S.queue[0].t<=S.t){const q=S.queue.shift();const e=mkEnemy(q.type,clamp(q.x,16,W-16),q.type==='boss'?-20:48);e.aux=Math.random()*6;spawnFX(e);if(q.type==='boss')S.boss=e}
  if(S.queue.length||!S.queue.length){}
  enemies.forEach(e=>updEnemy(e,dt));
  enemies=enemies.filter(e=>!e.dead);
  updProjs(dt);updComps(dt);updBullets(dt);
  for(let i=swamps.length-1;i>=0;i--){swamps[i].t-=dt;if(swamps[i].t<=0)swamps.splice(i,1)}
  // 회복
  const fl=facL('fountain');if(fl>0&&S.pond.hp<S.pond.max)S.pond.hp=Math.min(S.pond.max,S.pond.hp+.8*fl*dt);
  // 웨이브 종료
  if(!S.waveClear&&!S.queue.length&&!enemies.length&&!S.over&&WAVES[S.wi].boss!==true){
    S.waveClear=true;S.clearT=.9;
  }
  if(S.waveClear){S.clearT-=dt;if(S.clearT<=0)waveCleared()}
}
function fxUpdate(dt){
  parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt});parts=parts.filter(p=>p.t<p.life);
  floats.forEach(f=>{f.t+=dt;f.y-=22*dt});floats=floats.filter(f=>f.t<.8);
  rings.forEach(r=>r.t+=dt);rings=rings.filter(r=>r.t<r.life);
  bolts.forEach(b=>b.t+=dt);bolts=bolts.filter(b=>b.t<b.life);
  if(P.tongue){P.tongue.t+=dt;if(P.tongue.t>.2)P.tongue=null}
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
  shake=Math.max(0,shake-dt*30);flashPond=Math.max(0,flashPond-dt);
}

function waveCleared(){
  const w=S.ws;
  w.dur=+(S.gt-w.start).toFixed(1);
  const noLeak=w.leaks===0;
  const bonus=Math.round((10+S.wi*2+(noLeak?8:0))*S.dewMul);

  S.logWaves.push(w);
  ev('웨이브 '+(S.wi+1)+' 클리어 ('+w.dur+'s, 누수 '+w.leaks+', 연못 -'+Math.round(w.pondLost)+', 처치 '+w.kills+', 보상 이슬 +'+bonus+')');
  S.lastBonus=bonus;S.lastNoLeak=noLeak;
  S.pendingBranch=BRANCH_AFTER.includes(S.wi);
  S.pendingRelic=S.eliteWave&&S.eliteKilled;
  if(S.eliteWave&&!S.eliteKilled)ev('엘리트 미처치');

}

const C_T='#4ade80',C_C='#f59e0b',C_U='#38bdf8';
function tongueCards(){
  const L=[];
  if(S.radMul<2.2)L.push({cat:'혀 강화',col:C_T,n:'넓은 혀',d:'타격 반경 +20%',ap:()=>{S.radMul*=1.2}});

  if(S.dmgLvl<6)L.push({cat:'혀 강화',col:C_T,n:'힘센 혀',d:'혀 피해 +25%',ap:()=>{S.dmgLvl++}});
  if(S.cdMul>.55)L.push({cat:'혀 강화',col:C_T,n:'날쌘 혀',d:'타격 쿨다운 -15%',ap:()=>{S.cdMul*=.85}});
  if(!S.pierce)L.push({cat:'혀 강화',col:C_T,n:'관통 혀',d:'혀가 지나가는 길의 적도 50% 피해',ap:()=>{S.pierce=true}});
  if(S.chain<6)L.push({cat:'혀 강화',col:C_T,n:'연쇄 혀',d:'맞은 적 주변 2마리에게 45% 피해가 튀어요',ap:()=>{S.chain+=2}});
  Object.entries(ELEMS).forEach(([k,v])=>{if(!S.elem[k])L.push({cat:'속성 부여',col:v.col,n:v.n+' 혀',d:{fire:'맞은 적이 4초간 불타요 (재생 차단)',water:'적이 젖어 느려져요. 번개와 시너지!',volt:'번개가 튀어요(2마리). 젖은 적이면 더 강하게!',poison:'독이 중첩돼요 (최대 5중)',ice:'적이 느려지고, 3번 맞으면 얼어붙어요'}[k],ap:()=>{S.elem[k]=true}})});
  return L;
}
function compCards(){
  const L=[];
  const free=S.padN>S.comps.length;
  Object.keys(ROLES).forEach(r=>{
    const o=S.comps.find(c=>c.role===r);
    if(!o&&free)L.push({cat:'동료 영입',col:ROLES[r].col,n:ROLES[r].n+' ('+ROLES[r].role+')',d:ROLES[r].desc,w:2.5,ap:()=>{addComp(r)}});
    if(o&&o.lvl<3)L.push({cat:'동료 강화',col:ROLES[r].col,n:ROLES[r].n+' Lv'+(o.lvl+1),d:'성능 +40%, 스킬 「'+ROLES[r].skill+'」 강화',w:1.3,ap:()=>{o.lvl++}});
  });
  if(S.padN<6)L.push({cat:'연잎 확장',col:C_U,n:'연잎 슬롯 +1',d:'연잎 슬롯 '+S.padN+' → '+(S.padN+1)+' (동료 자리)',w:S.padN<=S.comps.length?1.8:.8,ap:()=>{S.padN++}});
  return L;
}
function wpick(L){const tot=L.reduce((s,c)=>s+(c.w||1),0);let r=Math.random()*tot;for(const c of L){r-=(c.w||1);if(r<=0)return c}return L[L.length-1]}
function genCards(){
  const out=[];
  const T=tongueCards(),Cc=compCards();
  const take=(L)=>{L=L.filter(c=>!out.includes(c)&&!out.some(o=>o.n===c.n));if(!L.length)return;out.push(wpick(L))};
  take(T);take(Cc.length?Cc:T);take(T.concat(Cc));
  while(out.length<3){const all=T.concat(Cc).filter(c=>!out.some(o=>o.n===c.n));if(!all.length)break;out.push(wpick(all))}
  return out;
}

const stage=$('stage'),cv=$('cv'),ctx2=cv.getContext('2d');

function resize(){
  const vw=innerWidth,vh=innerHeight;

function lp(e){const r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
const JOY_X=W*.5,JOY_Y=H*.5;
cv.addEventListener('pointerdown',e=>{
  if(scene!=='battle'||paused)return;
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  beep(1,.001,'sine',0);
  const p=lp(e);
  if(p.x<JOY_X&&p.y>JOY_Y&&!input.joy){
    input.joy={id:e.pointerId,ox:p.x,oy:p.y,cx:p.x,cy:p.y,active:true,t0:performance.now(),mv:0,sx:p.x,sy:p.y};
  }else if(!input.atk||!input.atk.down){
    input.atk={id:e.pointerId,down:true,x:p.x,y:p.y,held:0,last:gTime,buf:0};

  }

cv.addEventListener('pointermove',e=>{
  const p=lp(e);
  if(input.joy&&input.joy.id===e.pointerId){const j=input.joy;j.cx=p.x;j.cy=p.y;j.mv=Math.max(j.mv,dist(p.x,p.y,j.sx,j.sy));
    const d=dist(j.cx,j.cy,j.ox,j.oy);if(d>55){j.ox+=(j.cx-j.ox)*(d-55)/d;j.oy+=(j.cy-j.oy)*(d-55)/d}}

});
function pUp(e){
  if(input.joy&&input.joy.id===e.pointerId){
    const j=input.joy;
    if(performance.now()-j.t0<200&&j.mv<12&&scene==='battle'&&!paused){ // 짧은 탭은 공격으로
      if(!strike(j.sx,j.sy,false)){input.atk={id:-1,down:false,x:j.sx,y:j.sy,held:0,last:gTime,buf:.15,bx:j.sx,by:j.sy}}
    }

let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;

    gTime+=dt;

      let sdt=dt;
      if(hitstop>0){hitstop-=dt;sdt=0}

}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function draw(){

function drawEnemy(c,e){

  const tg=P.tongue;
  if(tg){
    const k=Math.min(1,tg.t/.07),back=tg.t>.1?1-(tg.t-.1)/.1:1,len=Math.max(0,Math.min(k,back));
    const mx=P.x,my=P.y-8,x=mx+(tg.tx-mx)*len,y=my+(tg.ty-my)*len;
    c.strokeStyle=tg.strong?'#fb7185':'#f472b6';c.lineWidth=tg.strong?8:5;c.lineCap='round';c.beginPath();c.moveTo(mx,my);c.lineTo(x,y);c.stroke();
    c.fillStyle=tg.strong?'#fda4af':'#f9a8d4';c.beginPath();c.arc(x,y,tg.strong?8:6,0,6.28);c.fill();c.lineCap='butt';
  }
  // 사거리 표시(약하게)
  c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=1;c.beginPath();c.arc(P.x,P.y-8,tRange(),0,6.28);c.stroke();
}
function drawJoy(c){
  const j=input.joy;if(!j)return;
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.arc(j.ox,j.oy,40,0,6.28);c.stroke();
  const dx=j.cx-j.ox,dy=j.cy-j.oy,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/40);
  c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.arc(j.ox+dx/d*k*40*(d>0?1:0),j.oy+dy/d*k*40,16,0,6.28);c.fill();
}
function drawHUD(c){
  const w=WAVES[S.wi];
  c.textBaseline='alphabetic';
  c.fillStyle='#fff';c.font='900 13px sans-serif';c.textAlign='left';
  c.fillText(w.boss?'BOSS':'WAVE '+(S.wi+1)+'/7',10,17);
  c.fillStyle='#facc15';c.textAlign='left';c.fillText('💧'+Math.floor(S.dew),100,17);
  // 진행 바
  const total=w.boss?1:(Object.values(w.mix).reduce((a,b)=>a+b,0)*(S.muts.includes('swarm')?1.6:1));
  const left=S.queue.length+enemies.filter(e=>!e.dead).length;
  const prog=w.boss?(S.boss?1-clamp(S.boss.hp/S.boss.max,0,1):0):clamp(1-left/Math.max(1,Math.round(total)),0,1);
  c.fillStyle='rgba(255,255,255,.15)';rr(c,160,8,130,8,4);c.fill();c.fillStyle='#38bdf8';rr(c,160,8,Math.max(2,130*prog),8,4);c.fill();
  if(S.t>45){c.fillStyle='#fb7185';c.font='900 11px sans-serif';c.textAlign='left';c.fillText('마무리 돌진!',160,27)}
  // 연못 체력
  const pr=S.pond.hp/S.pond.max;
  c.fillStyle='rgba(0,0,0,.45)';rr(c,10,24,W-20,12,6);c.fill();
  c.fillStyle=pr>.5?'#38bdf8':pr>.25?'#fbbf24':'#ef4444';rr(c,10,24,Math.max(4,(W-20)*pr),12,6);c.fill();
  if(S.pond.shield>0){c.fillStyle='rgba(249,168,212,.85)';rr(c,10,24,Math.min(W-20,(W-20)*S.pond.shield/S.pond.max),4,2);c.fill()}
  c.fillStyle='#fff';c.font='900 10px sans-serif';c.textAlign='center';c.fillText('연못 '+Math.ceil(S.pond.hp)+'/'+S.pond.max+(S.pond.shield>0?' +'+Math.ceil(S.pond.shield):''),W/2,34);
  // 변이
  if(S.muts.length){c.fillStyle='rgba(124,58,237,.85)';const t='변이: '+S.muts.map(m=>MUT[m].n).join(' + ');c.font='800 11px sans-serif';const tw=c.measureText(t).width+14;rr(c,W/2-tw/2,42,tw,16,8);c.fill();c.fillStyle='#fff';c.textAlign='center';c.fillText(t,W/2,54)}
  // 보스 바
  if(S.boss&&!S.boss.dead&&w.boss){const b=S.boss;c.fillStyle='rgba(0,0,0,.5)';rr(c,40,62,W-80,10,5);c.fill();c.fillStyle='#ef4444';rr(c,40,62,Math.max(4,(W-80)*Math.max(0,b.hp/b.max)),10,5);c.fill();c.fillStyle='#fff';c.font='800 10px sans-serif';c.textAlign='center';c.fillText('장수풍뎅이 대왕 · PHASE '+b.ph,W/2,82)}
  // 콤보
  if(S.combo>=2){const nx=S.combo%S.strongEvery===S.strongEvery-1;c.textAlign='right';c.font='900 '+(18+Math.min(S.combo,10))+'px sans-serif';c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.6)';const t=S.combo+' COMBO';c.strokeText(t,W-10,120);c.fillStyle=nx?'#fde047':'#fff';c.fillText(t,W-10,120);if(nx){c.font='900 12px sans-serif';c.fillStyle='#fde047';c.fillText('다음 타격: 강타!',W-10,136)}}
  // 쿨다운 힌트
  if(S.cd>0&&P.stun<=0){c.fillStyle='rgba(244,114,182,.7)';c.fillRect(P.x-14,P.y+18,28*(S.cd/tCd()),2)}
  // 배너
  if(banner){const a=Math.min(1,banner.t*2,(2.2-banner.t)*4);c.globalAlpha=Math.max(0,a);c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,230,W,90);c.textAlign='center';c.fillStyle='#fff';c.font='900 34px sans-serif';c.fillText(banner.l1,W/2,272);c.fillStyle='#c4b5fd';c.font='800 15px sans-serif';c.fillText(banner.l2,W/2,300);c.globalAlpha=1;
    if(S.wi>0&&S.muts.length){c.fillStyle='#e9d5ff';c.font='11px sans-serif';c.fillText(MUT[S.muts[0]].d.slice(0,34),W/2,316)}}
  if(S.wi===(+URLP.get('w')-1||0)&&S.t<8&&S.st.taps<4&&P.stun<=0){c.fillStyle='rgba(255,255,255,.85)';c.font='800 14px sans-serif';c.textAlign='center';c.fillText('화면을 탭해서 혀 공격!',W/2,380);c.font='12px sans-serif';c.fillText('왼쪽 아래를 끌면 이동',W/2,400)}
}

/* ================= UI 연결 ================= */
function setOptLabels(){$('bSound').textContent='소리 '+(opt.sound?'ON':'OFF');$('bVib').textContent='진동 '+(opt.vib?'ON':'OFF')}
$('bStart').onclick=()=>{beep(440,.1,'triangle',.05,200);startRun()};
$('bSound').onclick=()=>{opt.sound=!opt.sound;saveOpt();setOptLabels()};
$('bVib').onclick=()=>{opt.vib=!opt.vib;saveOpt();setOptLabels()};
$('bCopyAll').onclick=()=>{if(!runs.length){toast('저장된 로그가 없어요');return}copyText(allLogText(runs))};
$('bClear').onclick=()=>{if(confirm('저장된 로그를 모두 지울까요?')){runs=[];saveRuns();updCopyLabel()}};
$('bCopyClose').onclick=()=>$('copyBox').classList.remove('on');
function doPause(on){
  if(scene!=='battle')return;
  paused=on;
  if(on){$('sPause').classList.add('on');input.joy=null;if(input.atk)input.atk.down=false}else{$('sPause').classList.remove('on');last=performance.now()}
}
$('pauseBtn').onclick=()=>doPause(true);
$('bResume').onclick=()=>doPause(false);
$('bCopyNow').onclick=()=>{S.runObj=S.runObj||null;const tmp=buildRun();tmp.res='진행중';copyText(allLogText([tmp]))};
$('bQuit').onclick=()=>{paused=false;$('sPause').classList.remove('on');endRun('quit')};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scene==='battle'&&!paused)doPause(true)});
setOptLabels();updCopyLabel();
window.__dbg={get S(){return S},get enemies(){return enemies},get P(){return P},strike,startRun,get scene(){return scene},input,get runs(){return runs}};
requestAnimationFrame(frame);
</script>
